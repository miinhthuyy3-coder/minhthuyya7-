<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub — Không Gian Học Tập & Lưu Trữ Tài Liệu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f0f9ff;
            --bg-card: rgba(255, 255, 255, 0.88);
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --primary-light: #e0f2fe;
            --accent-mint: #10b981;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #bae6fd;
            --shadow: 0 10px 30px rgba(14, 165, 233, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 400;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #ecfdf5 100%);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--primary-dark);
        }

        .search-bar {
            flex: 1;
            max-width: 480px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: #f8fafc;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        .search-bar input:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .search-bar span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.92rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
        }

        /* Layout chính */
        .container {
            max-width: 1240px;
            margin: 28px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }

        /* Bộ lọc danh mục */
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .filter-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 7px 16px;
            border-radius: 999px;
            font-family: inherit;
            font-size: 0.88rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            font-weight: 500;
        }

        .stats-text {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        /* Lưới thẻ tài liệu */
        .doc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .doc-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .doc-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
        }

        .doc-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .doc-badge {
            background: var(--primary-light);
            color: var(--primary-dark);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .doc-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.65;
            transition: opacity 0.2s;
        }

        .icon-btn:hover { opacity: 1; }

        .doc-title {
            font-size: 1.08rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .doc-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .doc-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .tag-pill {
            font-size: 0.75rem;
            background: #f1f5f9;
            color: #475569;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .doc-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .open-link {
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 600;
        }

        .open-link:hover { text-decoration: underline; }

        /* Cột công cụ bên phải */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .widget {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .widget h3 {
            font-size: 1.02rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Pomodoro Timer */
        .timer-display {
            font-size: 2.6rem;
            font-weight: 600;
            text-align: center;
            color: var(--primary-dark);
            margin: 10px 0 16px;
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-outline {
            background: #f0f9ff;
            color: var(--primary-dark);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-outline:hover { background: var(--primary-light); }

        /* Ghi chú nhanh */
        .quick-note {
            width: 100%;
            height: 150px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            resize: vertical;
            background: rgba(248, 250, 252, 0.9);
            color: var(--text-main);
            outline: none;
        }

        .quick-note:focus { border-color: var(--primary); background: #fff; }

        .note-status {
            font-size: 0.76rem;
            color: var(--accent-mint);
            margin-top: 6px;
            text-align: right;
        }

        /* Modal thêm tài liệu */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 200;
        }

        .modal-backdrop.show { display: flex; }

        .modal {
            background: white;
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .modal h2 {
            font-size: 1.25rem;
            margin-bottom: 18px;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px dashed var(--border);
            color: var(--text-muted);
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span>📘</span>
            <span>StudyHub</span>
        </div>
        <div class="search-bar">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Tìm theo tên tài liệu, môn học, từ khóa (#toan, #code)..." oninput="renderDocs()">
        </div>
        <button class="btn-primary" onclick="openModal()">+ Lưu tài liệu mới</button>
    </header>

    <div class="container">
        <!-- Khu vực danh sách tài liệu -->
        <main>
            <div class="filters">
                <div class="filter-tags" id="categoryFilters">
                    <button class="filter-btn active" onclick="setCategory('Tất cả', this)">Tất cả</button>
                    <button class="filter-btn" onclick="setCategory('Lập trình', this)">Lập trình</button>
                    <button class="filter-btn" onclick="setCategory('Ngoại ngữ', this)">Ngoại ngữ</button>
                    <button class="filter-btn" onclick="setCategory('Toán & Khoa học', this)">Toán & Khoa học</button>
                    <button class="filter-btn" onclick="setCategory('Kỹ năng & Khác', this)">Kỹ năng & Khác</button>
                </div>
                <span class="stats-text" id="docCount">0 tài liệu</span>
            </div>

            <div class="doc-grid" id="docGrid"></div>
        </main>

        <!-- Thanh công cụ học tập bên phải -->
        <aside class="sidebar">
            <!-- Đồng hồ Pomodoro -->
            <div class="widget">
                <h3>⏱️ Đồng hồ tập trung (Pomodoro)</h3>
                <div class="timer-display" id="timerDisplay">25:00</div>
                <div class="timer-controls">
                    <button class="btn-primary" id="startTimerBtn" onclick="toggleTimer()">Bắt đầu</button>
                    <button class="btn-outline" onclick="resetTimer()">Đặt lại</button>
                </div>
            </div>

            <!-- Sổ tay ghi chú nhanh -->
            <div class="widget">
                <h3>📝 Ghi chú nhanh</h3>
                <textarea class="quick-note" id="quickNote" placeholder="Ghi lại ý tưởng, công thức hoặc danh sách việc cần học hôm nay..."></textarea>
                <div class="note-status" id="noteStatus">Tự động lưu trên trình duyệt</div>
            </div>

            <!-- Sao lưu dữ liệu -->
            <div class="widget">
                <h3>💾 Quản lý dữ liệu</h3>
                <p style="font-size: 0.84rem; color: var(--text-muted); margin-bottom: 12px;">
                    Tài liệu được lưu tự động trên trình duyệt của bạn. Xuất file JSON để sao lưu hoặc chuyển sang máy khác.
                </p>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-outline" style="flex:1;" onclick="exportData()">Xuất sao lưu</button>
                    <button class="btn-outline" style="flex:1;" onclick="document.getElementById('importFile').click()">Nhập dữ liệu</button>
                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
                </div>
            </div>
        </aside>
    </div>

    <!-- Modal Thêm / Sửa Tài Liệu -->
    <div class="modal-backdrop" id="docModal">
        <div class="modal">
            <h2 id="modalTitle">Lưu tài liệu học tập mới</h2>
            <form id="docForm" onsubmit="saveDoc(event)">
                <input type="hidden" id="docId">
                <div class="form-group">
                    <label>Tiêu đề tài liệu *</label>
                    <input type="text" id="titleInput" required placeholder="VD: Tổng hợp ngữ pháp Tiếng Anh B1">
                </div>
                <div class="form-group">
                    <label>Danh mục</label>
                    <select id="categoryInput">
                        <option value="Lập trình">Lập trình</option>
                        <option value="Ngoại ngữ">Ngoại ngữ</option>
                        <option value="Toán & Khoa học">Toán & Khoa học</option>
                        <option value="Kỹ năng & Khác">Kỹ năng & Khác</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Đường dẫn tài liệu (Google Drive, PDF, YouTube, Web...)</label>
                    <input type="url" id="urlInput" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Tóm tắt nội dung / Ghi chú</label>
                    <textarea id="descInput" rows="3" placeholder="Mô tả ngắn gọn nội dung chính của tài liệu..."></textarea>
                </div>
                <div class="form-group">
                    <label>Từ khóa (cách nhau bởi dấu phẩy)</label>
                    <input type="text" id="tagsInput" placeholder="VD: html, css, cơ bản">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-outline" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="btn-primary">Lưu tài liệu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Dữ liệu mẫu ban đầu
        const defaultDocs = [
            {
                id: 1,
                title: "Giáo trình HTML5 & CSS3 Cơ Bản",
                category: "Lập trình",
                url: "https://developer.mozilla.org/vi/docs/Web/HTML",
                desc: "Tài liệu hướng dẫn cấu trúc thẻ HTML, Flexbox, Grid và cách xây dựng giao diện web chuẩn.",
                tags: ["html", "css", "web"],
                pinned: true,
                date: "20/11/2026"
            },
            {
                id: 2,
                title: "3000 Từ Vựng Tiếng Anh Thông Dụng",
                category: "Ngoại ngữ",
                url: "https://www.oxfordlearnersdictionaries.com/",
                desc: "Danh sách từ vựng cốt lõi kèm phiên âm và ví dụ thực tế phục vụ đọc hiểu và giao tiếp.",
                tags: ["english", "vocabulary", "ielts"],
                pinned: false,
                date: "21/11/2026"
            },
            {
                id: 3,
                title: "Sổ Tay Công Thức Giải Tích & Đại Số",
                category: "Toán & Khoa học",
                url: "https://vi.wikipedia.org/wiki/Gi%E1%BA%A3i_t%C3%ADch",
                desc: "Tổng hợp công thức đạo hàm, tích phân, giới hạn và các dạng bài tập thường gặp.",
                tags: ["toan", "giaitich", "congthuc"],
                pinned: false,
                date: "22/11/2026"
            },
            {
                id: 4,
                title: "Phương Pháp Ghi Chép Cornell Hiệu Quả",
                category: "Kỹ năng & Khác",
                url: "https://lsc.cornell.edu/how-to-study/taking-notes/cornell-note-taking-system/",
                desc: "Cách chia bố cục trang giấy thành 3 phần giúp hệ thống hóa bài giảng và ôn tập nhanh.",
                tags: ["kynang", "ghichep", "tuhoc"],
                pinned: false,
                date: "23/11/2026"
            }
        ];

        let docs = JSON.parse(localStorage.getItem('studyhub_docs')) || defaultDocs;
        let activeCategory = 'Tất cả';

        function saveToStorage() {
            localStorage.setItem('studyhub_docs', JSON.stringify(docs));
        }

        function setCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderDocs();
        }

        function renderDocs() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const grid = document.getElementById('docGrid');

            // Sắp xếp tài liệu ghim lên đầu
            const sorted = [...docs].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

            const filtered = sorted.filter(doc => {
                const matchCat = activeCategory === 'Tất cả' || doc.category === activeCategory;
                const matchText = doc.title.toLowerCase().includes(keyword) ||
                                  doc.desc.toLowerCase().includes(keyword) ||
                                  doc.tags.some(t => t.toLowerCase().includes(keyword));
                return matchCat && matchText;
            });

            document.getElementById('docCount').textContent = `${filtered.length} tài liệu`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state">Không tìm thấy tài liệu phù hợp. Hãy thử từ khóa khác hoặc bấm <b>+ Lưu tài liệu mới</b>!</div>`;
                return;
            }

            grid.innerHTML = filtered.map(doc => `
                <div class="doc-card">
                    <div>
                        <div class="doc-top">
                            <span class="doc-badge">${doc.category}</span>
                            <div class="doc-actions">
                                <button class="icon-btn" title="${doc.pinned ? 'Bỏ ghim' : 'Ghim lên đầu'}" onclick="togglePin(${doc.id})">${doc.pinned ? '📌' : '📍'}</button>
                                <button class="icon-btn" title="Sửa" onclick="editDoc(${doc.id})">✏️</button>
                                <button class="icon-btn" title="Xóa" onclick="deleteDoc(${doc.id})">🗑️</button>
                            </div>
                        </div>
                        <div class="doc-title">${escapeHTML(doc.title)}</div>
                        <div class="doc-desc">${escapeHTML(doc.desc || 'Không có mô tả chi tiết.')}</div>
                        <div class="doc-tags">
                            ${doc.tags.map(t => `<span class="tag-pill">#${escapeHTML(t)}</span>`).join('')}
                        </div>
                    </div>
                    <div class="doc-footer">
                        <span>📅 ${doc.date}</span>
                        ${doc.url ? `<a href="${escapeHTML(doc.url)}" target="_blank" rel="noopener" class="open-link">Mở tài liệu ↗</a>` : `<span>Ghi chú nội bộ</span>`}
                    </div>
                </div>
            `).join('');
        }

        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        // Modal controls
        function openModal() {
            document.getElementById('docForm').reset();
            document.getElementById('docId').value = '';
            document.getElementById('modalTitle').textContent = 'Lưu tài liệu học tập mới';
            document.getElementById('docModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('docModal').classList.remove('show');
        }

        function saveDoc(e) {
            e.preventDefault();
            const id = document.getElementById('docId').value;
            const title = document.getElementById('titleInput').value.trim();
            const category = document.getElementById('categoryInput').value;
            const url = document.getElementById('urlInput').value.trim();
            const desc = document.getElementById('descInput').value.trim();
            const tags = document.getElementById('tagsInput').value
                .split(',')
                .map(t => t.trim().replace(/^#/, ''))
                .filter(Boolean);

            const today = new Date().toLocaleDateString('vi-VN');

            if (id) {
                const idx = docs.findIndex(d => d.id == id);
                if (idx !== -1) {
                    docs[idx] = { ...docs[idx], title, category, url, desc, tags };
                }
            } else {
                docs.unshift({
                    id: Date.now(),
                    title,
                    category,
                    url,
                    desc,
                    tags,
                    pinned: false,
                    date: today
                });
            }

            saveToStorage();
            closeModal();
            renderDocs();
        }

        function editDoc(id) {
            const doc = docs.find(d => d.id === id);
            if (!doc) return;
            document.getElementById('docId').value = doc.id;
            document.getElementById('titleInput').value = doc.title;
            document.getElementById('categoryInput').value = doc.category;
            document.getElementById('urlInput').value = doc.url || '';
            document.getElementById('descInput').value = doc.desc || '';
            document.getElementById('tagsInput').value = doc.tags.join(', ');
            document.getElementById('modalTitle').textContent = 'Chỉnh sửa tài liệu';
            document.getElementById('docModal').classList.add('show');
        }

        function deleteDoc(id) {
            if (confirm('Bạn có chắc muốn xóa tài liệu này không?')) {
                docs = docs.filter(d => d.id !== id);
                saveToStorage();
                renderDocs();
            }
        }

        function togglePin(id) {
            const doc = docs.find(d => d.id === id);
            if (doc) {
                doc.pinned = !doc.pinned;
                saveToStorage();
                renderDocs();
            }
        }

        // Đồng hồ Pomodoro 25 phút
        let timeLeft = 25 * 60;
        let timerInterval = null;

        function updateTimerDisplay() {
            const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const s = String(timeLeft % 60).padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${m}:${s}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('startTimerBtn');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.textContent = 'Tiếp tục';
            } else {
                btn.textContent = 'Tạm dừng';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        btn.textContent = 'Bắt đầu';
                        alert('Hết 25 phút tập trung! Hãy nghỉ ngơi 5 phút nhé.');
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timeLeft = 25 * 60;
            updateTimerDisplay();
            document.getElementById('startTimerBtn').textContent = 'Bắt đầu';
        }

        // Ghi chú nhanh tự động lưu
        const noteEl = document.getElementById('quickNote');
        noteEl.value = localStorage.getItem('studyhub_note') || '';
        noteEl.addEventListener('input', () => {
            localStorage.setItem('studyhub_note', noteEl.value);
            document.getElementById('noteStatus').textContent = 'Đã lưu lúc ' + new Date().toLocaleTimeString('vi-VN');
        });

        // Xuất / Nhập JSON sao lưu
        function exportData() {
            const blob = new Blob([JSON.stringify(docs, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'tai-lieu-hoc-tap.json';
            a.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        docs = imported;
                        saveToStorage();
                        renderDocs();
                        alert('Nhập dữ liệu thành công!');
                    }
                } catch {
                    alert('File sao lưu không hợp lệ.');
                }
            };
            reader.readAsText(file);
        }

        renderDocs();
    </script>
</body>
</html>
